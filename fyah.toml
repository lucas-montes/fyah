# Fyah development configuration
# Overrides the XDG default at ~/.config/fyah/config.toml

# ── Providers: API endpoints. The wire-format dialect lives on the model. ──
# This Ollama build (0.21.1) only serves the OpenAI-compat /v1 dialect, so the
# runnable provider speaks "openai" while pointing at the local server.
[providers.openai]
url = "http://127.0.0.1:11434/v1/chat/completions"
api_key = "ollama"

# Native /api/chat dialect (example; not served by this Ollama build).
[providers.ollama]
url = "http://127.0.0.1:11434/api/chat"
api_key = "ollama" # Required but ignored apparently

# ── Models: identity + per-provider wire config, tagged by format. ──
[models.gpt-4o]
format = "openai"
model = "gpt-4o"
max_completion_tokens = 4096
temperature = 0.7

# Local phi3, reached through Ollama's OpenAI-compat layer.
[models.phi3]
format = "openai"
model = "phi3:mini"
temperature = 0.3

# ── Agents: middleware bundle + system prompt + strict tool allow-list. ──
# tools = [...] restricts the [tools] catalog to the listed names; empty means
# no tools. The system prompt is a default the runtime may override.
[agents.primary]
system_prompt = "You are Fyah, an AI coding assistant."
max_iterations = 25
prompt_builder = "default"
context_builder = "default"
context_compaction = "default"
tools_filter = "default"
tools = ["shell", "code_interpreter", "file_search", "read_file", "filesystem"]

# ── Tools catalog: what fyah can expose. Agents pick from it by name. ──
[tools]
web_search = false
code_interpreter = true
computer_use = false
shell = true
tool_search = false
file_search = { vector_store_ids = ["vs_abc123"], max_num_results = 5 }

[[tools.mcp]]
name = "filesystem"
server_url = "http://localhost:3100"
server_description = "Access the local filesystem"

[[tools.custom]]
name = "read_file"
description = "Read a file from disk"
command = "execute_read_file"
parameters = { type = "object", properties = { path = { type = "string", description = "The file path" } }, required = ["path"] }

# ── Workflows: named step graphs; run with `--workflow <name>`. ──
# The built-in `default` workflow is compiled internally; defining
# [workflows.default] here overwrites it. Other names add extra workflows.
# Agent-involving steps may pin a default binding here; the runtime can
# still override it.

[workflows.default]
initial = "plan"
max_iterations = 50

[workflows.default.steps.plan]
type = "plan"
agent = "primary"
provider = "openai"
model = "phi3"
on_success = "implement"
on_failure = "plan"

[workflows.default.steps.implement]
type = "implement"
agent = "primary"
provider = "openai"
model = "phi3"
on_success = "validate"
on_failure = "plan"

[workflows.default.steps.validate]
type = "validate"
on_success = "commit"
on_failure = "implement"

[workflows.default.steps.commit]
type = "commit"
agent = "primary"
provider = "openai"
model = "phi3"
on_success = "done"
on_failure = "implement"
