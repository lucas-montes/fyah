# Fyah development configuration
# Overrides the XDG default at ~/.config/fyah/config.toml

[watcher]
debounce_ms = 2000

[providers.openrouter]
url = "https://openrouter.ai/api/v1/chat/completions"
api_key = "test"
format = "openai"
models = { "nemotron" = { name = "nvidia/nemotron-3.5-lightning:free", temperature = 0.7 } }


[providers.ollama]
url = "http://127.0.0.1:11434/v1/chat/completions"
api_key = "ollama"
format = "openai"
models = { "qwen25" = { name = "qwen2.5-coder:14b", temperature = 0.3 } }

[providers.mistral]
url = "https://api.mistral.ai/v1/chat/completions"
api_key = "test"
format = "openai"
models = { "medium" = { name = "mistral-medium-3-5", temperature = 0.3 } }



[agents.coder]
system_prompt = "You are Fyah, an AI coding assistant."
max_iterations = 25
provider = "ollama"
model = "qwen25"
tools = []
max_concurrent_tools = 1

[agents.default]
system_prompt = "You are Fyah, an AI coding assistant. You are in plan mode"
provider = "ollama"
model = "qwen25"
max_iterations = 25
tools = []
max_concurrent_tools = 10
on_input = "queue"
tools_on_input = "queue"
tools_interrupt_strategy = "keep"


[runtime]
ctrl_c = "immediate"


[[tools]]
name = "read_file"
description = "Read a file from disk"
executable = "execute_read_file"
parameters = { type = "object", properties = { path = { type = "string", description = "The file path" } }, required = [
    "path",
] }

[executables.execute_read_file]
type = "builtin"
builtin = "read_file"

[executables.session_start]
type = "command"
command = "./exes/session_start.sh"
fail_mode = "message"

[executables.session_end]
type = "command"
command = "./exes/session_end.sh"
fail_mode = "message"

[executables.step_before]
type = "command"
command = "./exes/step_before.sh"
fail_mode = "message"

[executables.step_after]
type = "command"
command = "./exes/step_after.sh"
fail_mode = "message"

[executables.turn_start]
type = "command"
command = "./exes/turn_start.sh"
fail_mode = "message"

[executables.turn_end]
type = "command"
command = "./exes/turn_end.sh"
fail_mode = "message"

[executables.verify_done]
type = "command"
command = "./exes/verify_done.sh"
fail_mode = "message"

[executables.pre_prompt]
type = "command"
command = "./exes/pre_prompt.sh"
fail_mode = "message"

[executables.pre_tool]
type = "command"
command = "./exes/pre_tool.sh"
fail_mode = "message"

[executables.post_tool]
type = "command"
command = "./exes/post_tool.sh"
fail_mode = "message"

[executables.on_error]
type = "command"
command = "./exes/on_error.sh"
fail_mode = "message"

# ============================================================================
# HOOKS REFERENCE
# ----------------------------------------------------------------------------
# One hook per slot: `{ executable = "<executables key>" }`.
# The harness builds the input (stdin JSON for `command` executables) and
# interprets the stdout JSON as a decision. Empty stdout means approval
# (`Continue` / `Done`). A hook whose executable is missing from
# `[executables.*]` is skipped; a hook whose executable fails is mapped to an
# outcome via its `fail_mode` (fail-open `message` vs fail-closed
# `abort_step` / `abort_workflow`).
#
# --- Executables -----------------------------------------------------------
# [executables.<key>]
# type = "builtin" | "command" | "wasm" | "plugin"
# timeout_secs = <int, optional>         # command: kill + fail after N s
# fail_mode = "message" | "abort_step" | "abort_workflow"   # default: message
# # type = "builtin": builtin = "noop" | "read_file" | "write_file"
# #                             | "prune_outputs" | "audit_append" | "budget_guard"
# #   Tool builtins are read_file + write_file only; there is no shell tool.
# #   Runs in-process with direct state access. Unknown names surface as an
# #   error so `fail_mode` decides fail-open vs fail-closed.
# # type = "command": command = "./hooks/audit.sh"  # + optional args = [...]
# #   Receives the slot input as stdin JSON, returns decision JSON on stdout.
# # type = "wasm":   path = "./plugins/x.wasm"      # + optional function = "..."
# # type = "plugin": name = "mcp__server__tool"     # + optional function = "..."
# #   wasm/plugin are not implemented yet and fall back per `fail_mode`.
#
# --- Workflow hooks: [workflows.<name>.hooks] -------------------------------
# session_start: once per session, before the workflow runs.
#   in:  { session_id, workflow, vcs_rev? }
#   out: {"decision":"continue"} | {"decision":"abort","error":{"code":"aborted","scope":"session","detail":"..."}}
# session_end: once per session, after the workflow finishes (audit only).
#   in:  { session_id, workflow, success, n_messages }
#   out: {"decision":"continue"}
#
# --- Step hooks: [workflows.<name>.steps.<step>] -----------------------------
# before / after: around a single step (`agent = ...` or `command = ...`).
#   in:  { workflow, step, session_id }
#   out: {"decision":"continue"} | {"decision":"abort_step",...} | {"decision":"abort_workflow",...}
#   error shape: {"code":"aborted","scope":"step"|"workflow","detail":"..."}
#
# --- Agent hooks: [agents.<name>.hooks] --------------------------------------
# turn_start: every loop iteration, before the LLM request.
#   in:  { agent, iteration, n_messages, queued_len, token_estimate }
#   out: {"decision":"continue"} | {"decision":"prune_to","keep":N} | {"decision":"abort",...}
# turn_end: after the model responds, before tool execution.
#   in:  { agent, iteration, n_tool_calls, has_text }
#   out: {"decision":"continue"} | {"decision":"drop_turn"}
# verify_done: when the model makes no tool calls (claims to be done).
#   A NotDone verdict is injected as a user message and the loop continues.
#   in:  { agent, iteration, last_text?, n_messages }
#   out: {"decision":"done"} | {"decision":"not_done","error":{"code":"check_failed","check":"...","detail":"..."}}
# pre_prompt: before the LLM request (context injection point).
#   in:  { agent, n_messages }
#   out: {"decision":"continue"} | {"decision":"abort",...}
#   NOTE: accepted by config but not executed by the loop yet.
# pre_tool: before a single tool call.
#   in:  { agent, call_id, tool, args }
#   out: {"decision":"continue"} | {"decision":"deny","error":{"code":"denied","rule":"...","detail":"..."}}
#   NOTE: accepted by config but not executed by the loop yet.
# post_tool: after a single tool result.
#   in:  { agent, call_id, tool, output_len }
#   out: {"decision":"continue"} | {"decision":"drop_result"}
#   NOTE: accepted by config but not executed by the loop yet.
# on_error: on LLM/tool errors.
#   in:  { agent, phase, error }
#   out: {"decision":"continue"} | {"decision":"abort",...}
#   NOTE: accepted by config but not executed by the loop yet.
#
# --- Context: [agents.<name>.context] ----------------------------------------
# strategy = "null" | "slidingwindow" | "budget"   # default: "null"
# max_messages = <int, optional>      # slidingwindow: keep newest N messages
# max_tokens = <int, optional>        # budget: prune when estimate exceeds N
# max_output_bytes = <int, optional>  # budget: truncate tool outputs past N bytes
# Enforced every iteration before turn_start; deterministic, no extra LLM call.
#
# --- Worked example (uncomment to enable) ------------------------------------
# [executables.audit_sh]
# type = "command"
# command = "./hooks/audit.sh"
# fail_mode = "message"
#
# [workflows.default.hooks]
# session_start = { executable = "audit_sh" }
# session_end = { executable = "audit_sh" }
#
# [workflows.default.steps.plan]
# before = { executable = "audit_sh" }
# after = { executable = "audit_sh" }
#
# [agents.coder.hooks]
# turn_start = { executable = "audit_sh" }
# turn_end = { executable = "audit_sh" }
# verify_done = { executable = "audit_sh" }
#
# [agents.coder.context]
# strategy = "slidingwindow"
# max_messages = 50


[workflows.default]
initial = "plan"

[workflows.default.hooks]
session_start = { executable = "session_start" }
session_end = { executable = "session_end" }

[workflows.default.steps.plan]
agent = "default"
on_success = "implement"
on_failure = "plan"
before = { executable = "step_before" }
after = { executable = "step_after" }

[workflows.default.steps.implement]
agent = "coder"
on_success = "validate"
on_failure = "plan"
before = { executable = "step_before" }
after = { executable = "step_after" }

[workflows.default.steps.validate]
command = "cargo test"
on_success = "commit"
on_failure = "implement"
before = { executable = "step_before" }
after = { executable = "step_after" }

[workflows.default.steps.commit]
command = "git diff"
on_success = "done"
on_failure = "implement"
before = { executable = "step_before" }
after = { executable = "step_after" }

[agents.coder.hooks]
pre_prompt = { executable = "pre_prompt" }
pre_tool = { executable = "pre_tool" }
post_tool = { executable = "post_tool" }
on_error = { executable = "on_error" }
turn_start = { executable = "turn_start" }
turn_end = { executable = "turn_end" }
verify_done = { executable = "verify_done" }

[agents.default.hooks]
pre_prompt = { executable = "pre_prompt" }
pre_tool = { executable = "pre_tool" }
post_tool = { executable = "post_tool" }
on_error = { executable = "on_error" }
turn_start = { executable = "turn_start" }
turn_end = { executable = "turn_end" }
verify_done = { executable = "verify_done" }
