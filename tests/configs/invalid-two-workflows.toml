# Invalid config: two broken workflows — both must be reported, grouped by
# workflow name.
#   workflow "a": step "plan" transitions to "ghost" (does not exist)
#   workflow "b": initial names "nope" (does not exist)

[workflows.a]
initial = "plan"
max_iterations = 10

[workflows.a.steps.plan]
type = "plan"
on_success = "ghost"
on_failure = "plan"

[workflows.b]
initial = "nope"
max_iterations = 10

[workflows.b.steps.plan]
type = "implement"
on_success = "done"
on_failure = "plan"