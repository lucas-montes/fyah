[package]
name = "fyah"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0.219", features = ["derive", "rc"] }
serde_json = "1.0.140"
paste = "1.0"
arc-swap = "1.7"

tracing = { version = "0.1", features = ["valuable"] }
tracing-subscriber = { version = "0.3", features = ["json", "env-filter", "valuable"] }
tracing-appender = "0.2"

chrono = { version = "0.4", features = ["serde"] }

reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2", "stream"] }

clap = { version = "4.5.40", features = ["derive"] }

tokio = { version = "1.46.1", features = ["macros", "rt", "net", "rt-multi-thread", "signal", "process", "fs", "io-std", "sync", "time"] }
tokio-util = "0.7"

toml = "0.8"

uuid = { version = "1.23.3", features = ["v7"] }

notify = { version = "9.0.0-rc.4", features = ["serde"] }
notify-types = "2.1"
notify-debouncer-full = "0.8.0-rc.2"

valuable = { version = "0.1.1", features = ["derive"] }
similar = "3.2.0"
sha2 = "0.11.0"


[workspace.lints.clippy]
all = { level = "deny" }
pedantic = { level = "deny" }

[workspace.lints.rust]
warnings = "deny"
